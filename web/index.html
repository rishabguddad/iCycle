<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacBook Marketplace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MacBook Marketplace</a>
    <nav class="nav">
      <a href="/" class="active">Shop</a>
      <a href="/admin.html">Admin</a>
      <button id="cart-button" class="cart-button" type="button">
        Cart <span id="cart-count" class="pill">0</span>
      </button>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Used &amp; refurbished MacBooks, parts and accessories</h1>
      <p>Every device tested. Every part matched to the model it fits.</p>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div id="category-tabs" class="tabs"></div>
      <div class="filters">
        <input id="search" type="search" placeholder="Search products…" aria-label="Search products">
        <select id="condition" aria-label="Condition">
          <option value="">Any condition</option>
          <option value="new">New</option>
          <option value="refurbished">Refurbished</option>
          <option value="used">Used</option>
        </select>
        <label class="check"><input id="in-stock" type="checkbox"> In stock only</label>
      </div>
    </section>

    <p id="status" class="status"></p>
    <section id="product-grid" class="grid" aria-live="polite"></section>
  </main>

  <!-- Product details -->
  <dialog id="product-dialog" class="dialog">
    <div id="product-detail"></div>
  </dialog>

  <!-- Cart and checkout -->
  <dialog id="cart-dialog" class="dialog drawer">
    <div class="dialog-head">
      <h2>Your cart</h2>
      <button class="icon-button" data-close type="button" aria-label="Close">✕</button>
    </div>
    <div id="cart-items"></div>
    <form id="checkout-form" class="form" hidden>
      <h3>Delivery details</h3>
      <label>Name <input name="name" required autocomplete="name"></label>
      <label>Phone (10 digits) <input name="phone" required inputmode="numeric" pattern="[0-9]{10}" autocomplete="tel"></label>
      <label>Address <input name="line1" required autocomplete="address-line1"></label>
      <div class="row">
        <label>City <input name="city" required autocomplete="address-level2"></label>
        <label>State <input name="state" required autocomplete="address-level1"></label>
      </div>
      <label>Pincode (6 digits) <input name="pincode" required inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code"></label>
      <button class="primary" type="submit">Place order</button>
    </form>
    <div id="order-result"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
